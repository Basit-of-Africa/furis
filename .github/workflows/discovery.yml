# Runs FURIS discovery outside Vercel, which stops long jobs partway.
#  - hourly: requests queued with the portal's "Run discovery" button
#  - weekly: full rediscovery for every researcher (brief §16, step 10)
# Needs repository secret NEON_DATABASE_URL (Neon *direct* connection string)
# and, optionally, repository variable FURIS_CONTACT_EMAIL (OpenAlex/Crossref polite pool).
# This repository is public, so job logs are public: the CLI prints only counts and record IDs, never names.
name: Discovery

on:
  schedule:
    - cron: "17 * * * *"   # hourly: queued requests
    - cron: "43 2 * * 1"   # Mondays 02:43 UTC: everyone
  workflow_dispatch:
    inputs:
      scope:
        description: "What to run"
        type: choice
        options: [pending, all]
        default: pending

concurrency:
  group: furis-discovery
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    env:
      FURIS_DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
      FURIS_CONTACT_EMAIL: ${{ vars.FURIS_CONTACT_EMAIL }}
      FURIS_OPENALEX_API_KEY: ${{ secrets.FURIS_OPENALEX_API_KEY }}
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Check configuration
        id: cfg
        # Runs before checkout, so not inside backend/ (it doesn't exist yet).
        working-directory: .
        run: |
          if [ -z "$FURIS_DATABASE_URL" ]; then
            echo "NEON_DATABASE_URL secret is not set; nothing to do."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v5
        if: steps.cfg.outputs.skip != 'true'
      - uses: actions/setup-python@v6
        if: steps.cfg.outputs.skip != 'true'
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install
        if: steps.cfg.outputs.skip != 'true'
        run: pip install -r requirements.txt
      - name: Run discovery
        if: steps.cfg.outputs.skip != 'true'
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            SCOPE="${{ inputs.scope }}"
          elif [ "${{ github.event.schedule }}" = "43 2 * * 1" ]; then
            SCOPE=all
          else
            SCOPE=pending
          fi
          echo "Scope: $SCOPE"
          python -m furis.cli discover --$SCOPE
          echo "Done. Results are in the Research Desk (review queue and search runs)."
