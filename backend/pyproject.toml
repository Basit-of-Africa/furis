[project]
name = "furis"
version = "0.1.0"
description = "Fountain University Research Intelligence System: backend and discovery engine"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0.30",
    "alembic>=1.13",
    "psycopg[binary]>=3.2",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "httpx>=0.27",
    "rapidfuzz>=3.9",
    "pyjwt[crypto]>=2.10",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = ["pytest>=8", "respx>=0.21"]

[project.scripts]
furis = "furis.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["furis*"]

# Vercel's FastAPI preset (project Root Directory = backend) serves this ASGI app.
[tool.vercel]
entrypoint = "furis.main:app"

[tool.pytest.ini_options]
testpaths = ["tests"]
